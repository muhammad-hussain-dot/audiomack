<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing — Audiomack</title>
  <link rel="icon" href="images/1.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>



  <a href="index.html" class="auth-back"><i class="bi bi-arrow-left"></i>Back to home</a>

  <main class="now-playing">
    <div class="now-playing-card">

      <div class="now-playing-art">
        
        <img src="images/cheap thrill.png" alt="Track artwork" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      </div>

      <h1 class="now-playing-title" id="trackTitle">cheap thrill</h1>
      <p class="now-playing-artist" id="trackArtist">dance floor confidence</p>

      <audio id="playerAudio" preload="metadata">
        <source src="audio/cheap thrill.mp3" type="audio/mpeg">
        Your browser doesn't support the audio element.
      </audio>

      <div class="now-playing-progress" id="progressBar">
        <div class="now-playing-progress-fill" id="progressFill"></div>
      </div>
      <div class="now-playing-time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="now-playing-controls">
        <button class="np-btn" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false">
          <i class="bi bi-shuffle"></i>
        </button>
        <button class="np-btn" id="prevBtn" type="button" aria-label="Previous track">
          <i class="bi bi-skip-start-fill"></i>
        </button>
        <button class="np-btn" id="playPauseBtn" type="button" aria-label="Play">
          <i class="bi bi-play-fill" id="playPauseIcon"></i>
        </button>
        <button class="np-btn" id="nextBtn" type="button" aria-label="Next track">
          <i class="bi bi-skip-end-fill"></i>
        </button>
        <button class="np-btn" id="repeatBtn" type="button" aria-label="Repeat" aria-pressed="false">
          <i class="bi bi-repeat"></i>
        </button>
      </div>

      <div class="now-playing-volume">
        <i class="bi bi-volume-up" id="volumeIcon"></i>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume">
      </div>

    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
