<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Audiomack</title>
  <link rel="icon" href="images/1.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <a href="index.html" class="auth-back"><i class="bi bi-arrow-left"></i>Back to home</a>

  <main class="auth-page">
    <div class="auth-card">
      <a class="navbar-brand" href="index.html">
        <img src="images/1.png" alt="Audiomack logo" class="brand-logo" />
        Audiomack
      </a>

      <h1>Welcome back</h1>
      <p>Log in to pick up your queue where you left off.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" autocomplete="email">
          <span class="field-error" id="loginEmailError"></span>
        </div>

        <div class="field-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Your password" autocomplete="current-password">
          <span class="field-error" id="loginPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-cta auth-submit">Log in</button>

        <p class="signup-success d-none" id="loginSuccess">
          <i class="bi bi-check-circle-fill"></i> Logged in — taking you to your library.
        </p>
      </form>

      <div class="auth-links">
        <a href="#">Forgot password?</a>
        <a href="index.html#stay-tuned">Create an account</a>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
